<section class="hero-section">

  <div class="container hero-wrapper">

    <!-- LEFT CONTENT -->
    <article class="hero-content">

      <p class="hero-badge">
        FULL STACK DEVELOPER
      </p>

      <h1>
        Hi, I'm <span>Ali Ahsan</span>
      </h1>

      <h2>
        Modern Angular & .NET Developer
      </h2>

      <p class="hero-description">
        I build modern, responsive, scalable, and high-performance web applications
        using Angular, .NET, SQL Server, and cloud technologies.
      </p>

      <div class="btn-group">

        <a
          routerLink="/resume"
          class="btn btn-primary"
          aria-label="Hire Ali Ahsan">
          Hire Me
        </a>

        <a
          routerLink="/contact"
          class="btn btn-outline-primary"
          aria-label="Contact Ali Ahsan">
          Let's Talk
        </a>

      </div>

    </article>

    <!-- RIGHT IMAGE -->
    <figure class="hero-image">

      <div class="glass-frame">

        <img
          src="assets/profile/profile.avif"
          alt="Ali Ahsan Full Stack Developer"
          width="400"
          height="400"
          loading="eager"
          fetchpriority="high"
          decoding="async"
        />

      </div>

    </figure>

  </div>

  <!-- SKILLS -->
  <section class="skills-section">

    <div class="container">

      <div class="skills-slider">

        <div class="skills-track">

          <img
            *ngFor="let skill of duplicatedSkills; trackBy: trackBySkill"
            [src]="skill"
            class="skill-logo"
            alt="Technology logo"
            loading="lazy"
            decoding="async"
            width="60"
            height="60"
          />

        </div>

      </div>

    </div>

  </section>

</section>

<main>

  <app-public-projects></app-public-projects>

  <app-services></app-services>

  <app-about></app-about>

  <app-skills></app-skills>

  <app-testimonial></app-testimonial>

  <app-contact></app-contact>

</main>

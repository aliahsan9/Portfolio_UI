<section class="hero-section">
  <div class="container d-flex flex-column flex-lg-row align-items-center justify-content-between">
    
    <!-- ===== Left: Hero Content ===== -->
    <div class="hero-content text-center text-lg-start">
      <h1>Hi, I'm <span>Ali Ahsan</span></h1>
      <h2>Full Stack Developer</h2>
      <p>
        I build modern, responsive, and high-performance web apps with Angular, .NET, and SQL Server.
        Passionate about creating elegant and efficient digital experiences.
      </p>
      <div class="btn-group">
        <button class="btn btn-primary" routerLink="/resume">Resume</button>
        <button class="btn btn-outline-primary" routerLink="/contact">Let's Talk</button>
      </div>
    </div>

    <!-- ===== Right: Profile Image (Glassmorphic Frame) ===== -->
    <div class="hero-image mt-4 mt-lg-0">
      <div class="glass-frame">
          <img
              src="assets/profile/profile.avif"
              fetchpriority="high"
              loading="lazy"
              decoding="async"
              width="400"
              height="400"
              alt="Ali Ahsan Profile"
            />
        <span class="shine"></span>
      </div>
    </div>

  </div>

  <!-- ===== Skills Section ===== -->
  <section class="skills-section py-5">
    <div class="container text-center">
      <div class="skills-slider overflow-hidden">
        <div class="skills-track d-flex align-items-center">
          <img *ngFor="let skill of skills" [src]="skill" alt="Skill Logo" class="skill-logo mx-3" />
        </div>
      </div>
    </div>
    <app-services></app-services>
    <app-about></app-about>
    <app-skills></app-skills>
    <app-public-projects></app-public-projects>
    <app-blogs></app-blogs>
    <app-newsletter></app-newsletter>
  </section>
</section>

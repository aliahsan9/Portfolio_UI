<section id="skills" class="skills-section py-5 text-center">
  <div class="container">
    <!-- Section Title -->
    <h1 class="fw-bold text-gradient mb-3" data-aos="fade-down">
      Skills & Expertise
    </h1>
    <p class="text-light mb-5" data-aos="fade-up">
      Blending <strong>Frontend Elegance</strong>, <strong>Backend Strength</strong>, and 
      <strong>Engineering Precision</strong>.
    </p>

    <!-- Skills Grid -->
    <div class="row g-4 justify-content-center">
      <div
        class="col-sm-6 col-md-4 col-lg-3 skill-card"
        *ngFor="let skill of skills"
        data-aos="fade-up"
        [attr.data-aos-delay]="skill.delay"
      >
        <div class="d-flex align-items-center mb-2">
          <img [src]="skill.icon" alt="{{skill.title}}" class="skill-icon me-2" />
          <h5 class="fw-semibold text-white mb-0">{{ skill.title }}</h5>
        </div>

        <div class="progress skill-progress">
          <div
            class="progress-bar"
            role="progressbar"
            [ngClass]="skill.color"
            [style.width.%]="skill.percent"
            [attr.aria-valuenow]="skill.percent"
            [attr.aria-valuemin]="0"
            [attr.aria-valuemax]="100"
          ></div>
        </div>

        <div class="d-flex justify-content-between mt-1">
          <small class="text-light">{{ skill.desc }}</small>
          <small class="text-light">{{ skill.percent }}%</small>
        </div>
      </div>
    </div>
  </div>
</section>

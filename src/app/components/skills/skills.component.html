<section class="skills-section">

  <div class="container">

    <!-- HEADER -->
    <div class="text-center mb-5">
      <h2 class="title">Skills & Expertise</h2>
      <p class="subtitle">
        A quick overview of my technical stack and core development strengths.
      </p>
    </div>

    <!-- GRID -->
    <div class="row g-4">

      <div class="col-lg-6" *ngFor="let skill of skills">

        <div class="skill-card">

          <!-- TOP -->
          <div class="d-flex justify-content-between align-items-center">

            <div class="d-flex align-items-center gap-3">

              <img [src]="skill.icon" class="icon" />

              <div>
                <h5 class="mb-0">{{ skill.title }}</h5>
                <small class="level">{{ skill.level }}</small>
              </div>

            </div>

            <div class="percent">
              {{ skill.percent }}%
            </div>

          </div>

          <!-- PROGRESS -->
          <div class="progress mt-3">
            <div class="progress-bar" [style.width.%]="skill.percent"></div>
          </div>

          <!-- DESCRIPTION -->
          <p class="desc mt-3">
            {{ skill.description }}
          </p>

          <!-- TAGS -->
          <div class="tags">
            <span *ngFor="let tech of skill.technologies">
              {{ tech }}
            </span>
          </div>

        </div>

      </div>

    </div>

  </div>

</section>

<section class="contact-section">
  <div class="container">

    <div class="text-center mb-5">
      <h2 class="title">Contact Me</h2>
      <p class="subtitle">
        Let’s discuss your project. I usually reply within 24 hours.
      </p>
    </div>

    <div class="row justify-content-center">

      <div class="col-lg-6">

        <form #form="ngForm" (ngSubmit)="sendEmail(form)" class="contact-form">

          <div class="mb-3">
            <label>Name</label>
            <input
              type="text"
              name="name"
              ngModel
              class="form-control"
              required
              placeholder="Your Name"
            />
          </div>

          <div class="mb-3">
            <label>Email</label>
            <input
              type="email"
              name="email"
              ngModel
              class="form-control"
              required
              placeholder="Your Email"
            />
          </div>

          <div class="mb-3">
            <label>Message</label>
            <textarea
              name="message"
              ngModel
              class="form-control"
              rows="5"
              required
              placeholder="Your Message"
            ></textarea>
          </div>

          <button type="submit" class="btn submit-btn w-100">
            Send Message
          </button>

        </form>

      </div>

    </div>

  </div>
</section>

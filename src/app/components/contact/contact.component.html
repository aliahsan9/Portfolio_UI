<div class="container py-5 text-white">
  <h2 class="text-center mb-4 text-gradient fw-bold display-5" data-aos="fade-down" style="letter-spacing: 2px;">
    <span style="background: linear-gradient(90deg, #00c6ff 0%, #0072ff 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
      Get In Touch
    </span>
  </h2>  

  <form
    [formGroup]="contactForm"
    (ngSubmit)="onSubmit()"
    class="p-4 custom-form rounded shadow"
    data-aos="fade-up"
  >
    <div class="form-group mb-3" data-aos="fade-right" data-aos-delay="100">
      <label class="form-label">Your Name</label>
      <input formControlName="name" class="form-control input-glow" placeholder="Enter your name" />
      <div *ngIf="submitted && contactForm.controls['name'].errors" class="text-danger small mt-1">
        Name is required (min 3 characters).
      </div>
    </div>

    <div class="form-group mb-3"  data-aos="fade-left" data-aos-delay="200">
      <label class="form-label">Email Address</label>
      <input
        type="email"
        formControlName="email"
        class="form-control input-glow"
        placeholder="you@example.com"
      />
      <div *ngIf="submitted && contactForm.controls['email'].errors" class="text-danger small mt-1">
        Enter a valid email.
      </div>
    </div>

    <div class="form-group mb-3" data-aos="fade-right" data-aos-delay="300">
      <label class="form-label">Message</label>
      <textarea
        formControlName="message"
        class="form-control input-glow"
        rows="5"
        placeholder="Write your message..."
      ></textarea>
      <div *ngIf="submitted && contactForm.controls['message'].errors" class="text-danger small mt-1">
        Message is required (min 10 characters).
      </div>
    </div>

    <button class="btn btn-send btn-outline-light mt-2" type="submit" data-aos="zoom-in" data-aos-delay="400">
      🚀 Send Message
    </button>

    <div class="mt-3">
      <div *ngIf="success" class="alert alert-success mt-3" data-aos="fade-in">Thank you! Your message has been sent.</div>
      <div *ngIf="error" class="alert alert-danger mt-3" data-aos="fade-in">Something went wrong. Please try again.</div>
    </div>
  </form>
</div>

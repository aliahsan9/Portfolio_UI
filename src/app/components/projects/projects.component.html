<section class="projects-section" id="projects">

  <div class="container">

    <!-- HEADER -->
    <div class="text-center mb-5">
      <span class="badge-glow">Featured Work</span>

      <h1 class="display-title mt-3">
        Selected Projects
      </h1>

      <p class="section-desc">
        Real-world full-stack applications with modern architecture and premium UI experience.
      </p>
    </div>

    <!-- GRID -->
    <div class="row g-4">

      <div class="col-12 col-md-6"
           *ngFor="let project of projects; let i = index">

        <!-- CARD -->
        <div class="project-card"
             (mouseenter)="hoveredIndex = i"
             (mouseleave)="hoveredIndex = null">

          <!-- MONITOR FRAME -->
          <div class="monitor">

            <div class="screen">

              <img [src]="project.image"
                   [alt]="project.title"
                   [class.scroll-effect]="hoveredIndex === i">

            </div>

            <img class="frame"
                 src="assets/Images/monitor-frame.avif"
                 alt="monitor frame">

          </div>

          <!-- CONTENT -->
          <div class="content">

            <div class="d-flex align-items-center gap-3 mb-2">

              <div class="icon-box">
                <i [class]="project.icon"></i>
              </div>

              <h2 class="title">
                {{ project.title }}
              </h2>

            </div>

            <p class="desc">
              {{ project.description }}
            </p>

            <!-- TECH -->
            <div class="tech">
              <span class="pill"
                    *ngFor="let tech of project.technologies">
                {{ tech }}
              </span>
            </div>

            <a [routerLink]="project.route" class="btn-glow">
              View Project <i class="bi bi-arrow-up-right"></i>
            </a>

          </div>

        </div>

      </div>

    </div>

  </div>

</section>

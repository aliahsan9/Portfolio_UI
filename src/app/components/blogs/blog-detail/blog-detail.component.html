<div class="blog-page">

  <!-- HERO -->
  <header class="blog-hero">
    <div class="container hero-container">

      <a
        routerLink="/blogs"
        class="back-link">
        ← Back to Blogs
      </a>

      <h1 class="blog-title">
        {{ title }}
      </h1>

    </div>
  </header>

  <!-- CONTENT -->
  <main class="blog-main">
    <div class="container">

      <article class="blog-article">

        <div
          class="markdown-body"
          #markdownContainer>

          <markdown
            [src]="markdownPath"
            (ready)="onMarkdownReady()">
          </markdown>

        </div>

      </article>

    </div>
  </main>

</div>

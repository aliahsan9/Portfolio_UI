<div class="container py-5 text-white">
  <h2 class="text-center mb-4" data-aos="fade-down">Contact Messages</h2>

  <div *ngIf="messages.length > 0; else noMessages">
    <div class="table-responsive" data-aos="fade-up">
      <table class="table table-dark table-striped table-hover">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Message</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let msg of messages">
            <td>{{ msg.name }}</td>
            <td>{{ msg.email }}</td>
            <td>{{ msg.message }}</td>
            <td>{{ msg.dateSent | date: 'short' }}</td>
            <td>
              <button class="btn btn-danger btn-sm" (click)="deleteMessage(msg.id!)">
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <ng-template #noMessages>
    <p class="text-center text-muted">No contact messages yet.</p>
  </ng-template>
</div>

<div class="container py-4">
  <h2 class="text-white mb-4">{{ editMode ? 'Update Skill' : 'Add New Skill' }}</h2>

  <form [formGroup]="skillForm" (ngSubmit)="submit()" class="bg-dark p-4 rounded mb-5">
    <div class="mb-3">
      <label class="form-label text-white">Skill Name</label>
      <input type="text" formControlName="name" class="form-control" placeholder="e.g. Angular" />
    </div>
 
    <div class="mb-3">
      <label class="form-label text-white">Skill Level</label>
      <input type="text" formControlName="level" class="form-control" placeholder="e.g. Advanced" />
    </div>
 
    <button class="btn btn-primary me-2" type="submit" [disabled]="skillForm.invalid">
      {{ editMode ? 'Update' : 'Create' }}
    </button>
    <button class="btn btn-secondary" type="button" (click)="resetForm()">Reset</button>
  </form>

  <h3 class="text-white mb-3">Existing Skills</h3>
  <table class="table table-dark table-striped">
    <thead>
      <tr>
        <th>Name</th>
        <th>Level</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let skill of skills">
        <td>{{ skill.name }}</td>
        <td>{{ skill.level }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-2" (click)="edit(skill)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="delete(skill.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table> 
</div>

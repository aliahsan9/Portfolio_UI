<div class="container py-4 text-white">
  <h2 class="mb-4" data-aos="fade-right">
    {{ editingProjectId ? 'Edit Project' : 'Add New Project' }}
  </h2>

  <form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="mb-5" data-aos="fade-up">
    <div class="form-group mb-3">
      <label class="form-label">Title</label>
      <input class="form-control" formControlName="title" placeholder="Project title..." />
    </div>
    <div class="form-group mb-3">
      <label class="form-label">Description</label>
      <textarea rows="3" class="form-control" formControlName="description" placeholder="Project description..."></textarea>
    </div>
    <div class="form-group mb-3">
      <label class="form-label">Image URL</label>
      <input class="form-control" formControlName="imageUrl" placeholder="https://..." />
    </div>
    <div class="form-group mb-3">
      <label class="form-label">GitHub Link</label>
      <input class="form-control" formControlName="gitHubLink" placeholder="https://github.com/..." />
    </div>

    <button class="btn btn-success me-2" type="submit">
      {{ editingProjectId ? 'Update Project' : 'Add Project' }}
    </button>
    <button class="btn btn-secondary" type="button" *ngIf="editingProjectId" (click)="cancelEdit()">Cancel</button>
  </form>

  <h3 class="mb-3" data-aos="fade-left">All Projects</h3>
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let project of projects" data-aos="zoom-in">
      <div class="card bg-dark text-white shadow h-100 border border-secondary">
        <img [src]="project.imageUrl" class="card-img-top rounded-top" alt="Project Image" />
        <div class="card-body">
          <h5 class="card-title">{{ project.title }}</h5>
          <p class="card-text small">{{ project.description }}</p>
        </div>
        <div class="card-footer d-flex justify-content-between">
          <a [href]="project.gitHubLink" target="_blank" class="btn btn-outline-light btn-sm">GitHub</a>
          <div>
            <button class="btn btn-primary btn-sm me-1" (click)="editProject(project)">Edit</button>
            <button class="btn btn-danger btn-sm" (click)="deleteProject(project.id!)">Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

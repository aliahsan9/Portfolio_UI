<div class="container py-5 text-white">
  <h2 class="mb-4 text-center" data-aos="fade-right">Manage Resume</h2>

  <form [formGroup]="resumeForm" (ngSubmit)="onSubmit()" data-aos="fade-up" class="p-4 rounded bg-dark shadow">
    <div class="form-group mb-3">
      <label class="form-label">Resume File URL (PDF)</label>
      <input type="text" formControlName="fileUrl" class="form-control" placeholder="https://yourdomain.com/resume.pdf" />
    </div>

    <button class="btn btn-primary" type="submit">
      {{ resumeId ? 'Update Resume' : 'Upload Resume' }}
    </button>
  </form>

  <div class="mt-5" *ngIf="resumeId" data-aos="zoom-in">
    <h5>Current Resume:</h5>
    <a [href]="resumeForm.value.fileUrl" target="_blank" class="btn btn-outline-light">
      <i class="bi bi-file-earmark-pdf"></i> View Resume
    </a>
  </div>
</div>

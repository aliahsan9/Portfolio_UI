<div class="container mt-5" style="max-width: 400px;">
  <h3 class="mb-4 text-center">Admin Login</h3>

  <form [formGroup]="loginForm" (ngSubmit)="login()" novalidate>
    <div class="form-group mb-3">
      <label for="email">Email</label>
      <input
        id="email"  
        type="email"
        formControlName="email"
        class="form-control"
        [ngClass]="{ 'is-invalid': loginForm.get('email')?.touched && loginForm.get('email')?.invalid }"
      />
      <div class="invalid-feedback" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">
        Email is required.
      </div>
      <div class="invalid-feedback" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')">
        Invalid email format.
      </div>
    </div>
    <div class="form-group mb-3">
      <label for="password">Password</label>
      <input
        id="password"     
        type="password" 
        formControlName="password"
        class="form-control"
        [ngClass]="{ 'is-invalid': loginForm.get('password')?.touched && loginForm.get('password')?.invalid }"
      />
      <div class="invalid-feedback" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">
        Password is required.
      </div>
    </div>

    <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">
      Login
    </button>
  </form>
</div>

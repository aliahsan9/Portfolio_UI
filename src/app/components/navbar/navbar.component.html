<nav class="navbar custom-navbar shadow-sm" aria-label="Main navigation">
  <div class="container-fluid d-flex align-items-center">

    <!-- Brand -->
    <a
      class="navbar-brand text-glow fw-bold me-auto"
      routerLink="/"
      aria-label="Ali Ahsan - Home"
      (click)="closeSidebar()"
    >
      Ali Ahsan
    </a>

    <!-- Navigation links -->
    <div
      class="navbar-sidebar"
      id="sidebar"
      [class.active]="isSidebarOpen"
    >
      <ul class="navbar-nav">
        <li class="nav-item" *ngFor="let link of navLinks">
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link custom-nav-link"
            (click)="closeSidebar()"
          >
            {{ link.label }}
          </a>
        </li>
      </ul>
    </div>

    <!-- Theme and mobile navigation controls -->
    <div class="nav-actions d-flex align-items-center">
      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="
          themeService.theme() === 'dark'
            ? 'Switch to light theme'
            : 'Switch to dark theme'
        "
        [title]="
          themeService.theme() === 'dark'
            ? 'Light mode'
            : 'Dark mode'
        "
      >
        <i
          class="bi"
          [class.bi-sun-fill]="themeService.theme() === 'dark'"
          [class.bi-moon-stars-fill]="themeService.theme() === 'light'"
          aria-hidden="true"
        ></i>
      </button>

      <button
        class="navbar-toggler"
        type="button"
        (click)="toggleSidebar()"
        [attr.aria-expanded]="isSidebarOpen"
        aria-controls="sidebar"
        aria-label="Toggle navigation"
        [class.open]="isSidebarOpen"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

  </div>
</nav>

<!-- Mobile sidebar backdrop -->
<div
  class="sidebar-backdrop"
  *ngIf="isSidebarOpen"
  (click)="closeSidebar()"
  aria-hidden="true"
></div>

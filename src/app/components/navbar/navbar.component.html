<nav
  class="navbar custom-navbar shadow-lg px-4"
>
  <div class="container-fluid d-flex align-items-center justify-content-between">
    <!-- Brand -->
    <div class="d-flex align-items-center gap-2">
      <a class="navbar-brand text-glow fw-bold fs-4" routerLink="/">Ali Ahsan</a>
    </div>

    <!-- Hamburger -->
    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleSidebar()"
      [attr.aria-expanded]="isSidebarOpen"
      aria-label="Toggle navigation"
      [class.open]="isSidebarOpen"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Sidebar / desktop menu -->
    <div class="navbar-sidebar" id="sidebar" [class.active]="isSidebarOpen">
      <ul class="navbar-nav gap-3">
        <li
          class="nav-item"
          *ngFor="let link of navLinks; let i = index"
              >
          <a
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link custom-nav-link"
            (click)="closeSidebar()"
          >
            {{ link.label }}
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Backdrop that closes the sidebar when clicking outside -->
<div
  class="sidebar-backdrop"
  *ngIf="isSidebarOpen"
  (click)="closeSidebar()"
  aria-hidden="true"
></div>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="colTitle colDesc">
  <title id="colTitle">Schematic of model collapse across generations</title>
  <desc id="colDesc">A schematic, not a redraw of the Nature figure. Generation 0 has a long tail of rare events. Generation 1 has lost the smallest bars. Generation 2 is dominated by one bar. Early collapse is the loss of the tails. Late collapse is convergence toward a spike.</desc>
  <rect width="960" height="560" fill="#f7f3ea"/>
  <text x="36" y="40" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="18">Figure 4</text>
  <text x="36" y="72" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">The tail leaves first. The spike comes later.</text>
  <text x="36" y="100" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="15">Schematic of Shumailov et al., Nature 2024. Bar heights are illustrative, not their measurements.</text>

  <rect x="28" y="124" width="290" height="250" rx="14" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="44" y="152" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Generation 0</text>
  <text x="44" y="174" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">human data, tail intact</text>
  <rect x="48" y="214" width="16" height="130" rx="3" fill="#1d4ed8"/>
  <rect x="70" y="244" width="16" height="100" rx="3" fill="#1d4ed8"/>
  <rect x="92" y="274" width="16" height="70" rx="3" fill="#0f766e"/>
  <rect x="114" y="294" width="16" height="50" rx="3" fill="#0f766e"/>
  <rect x="136" y="310" width="16" height="34" rx="3" fill="#0f766e"/>
  <rect x="158" y="322" width="16" height="22" rx="3" fill="#b45309"/>
  <rect x="180" y="330" width="16" height="14" rx="3" fill="#b45309"/>
  <rect x="202" y="336" width="16" height="8" rx="2" fill="#b45309"/>
  <rect x="224" y="338" width="16" height="6" rx="2" fill="#9f1239"/>
  <rect x="246" y="340" width="16" height="4" rx="2" fill="#9f1239"/>
  <rect x="268" y="342" width="16" height="2" rx="1" fill="#9f1239"/>
  <line x1="44" y1="344" x2="292" y2="344" stroke="#a8a29e" stroke-width="1"/>

  <rect x="334" y="124" width="290" height="250" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="350" y="152" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Generation 1</text>
  <text x="350" y="174" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">early collapse: tails missing</text>
  <rect x="372" y="196" width="22" height="148" rx="3" fill="#1d4ed8"/>
  <rect x="404" y="236" width="22" height="108" rx="3" fill="#1d4ed8"/>
  <rect x="436" y="276" width="22" height="68" rx="3" fill="#0f766e"/>
  <rect x="468" y="308" width="22" height="36" rx="3" fill="#b45309"/>
  <rect x="500" y="328" width="22" height="16" rx="3" fill="#b45309"/>
  <rect x="532" y="338" width="22" height="6" rx="2" fill="#9f1239"/>
  <line x1="360" y1="344" x2="590" y2="344" stroke="#a8a29e" stroke-width="1"/>
  <text x="350" y="366" fill="#9f1239" font-family="Segoe UI, sans-serif" font-size="12">probability under 1/M is often missed</text>

  <rect x="640" y="124" width="292" height="250" rx="14" fill="#fff7ed" stroke="#b91c1c" stroke-width="2"/>
  <text x="656" y="152" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Generation 2</text>
  <text x="656" y="174" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">late collapse: variance shrinks</text>
  <rect x="700" y="188" width="36" height="156" rx="3" fill="#b91c1c"/>
  <rect x="748" y="300" width="36" height="44" rx="3" fill="#b45309"/>
  <rect x="796" y="328" width="36" height="16" rx="3" fill="#9f1239"/>
  <line x1="676" y1="344" x2="900" y2="344" stroke="#a8a29e" stroke-width="1"/>
  <text x="656" y="366" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="12">the fit believes the tail was never there</text>

  <rect x="28" y="394" width="904" height="136" rx="14" fill="#ffffff" stroke="#44403c" stroke-width="1.6"/>
  <text x="48" y="428" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">What gets mixed into the next training set</text>
  <text x="48" y="460" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="15">p(i+1) = alpha * p_theta + beta * p(i) + gamma * p(0)</text>
  <text x="48" y="492" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">p(0) is the original human distribution. gamma is the fraction of it you still keep.</text>
  <text x="48" y="516" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">In their OPT-125m run, gamma = 0.10 held the damage to a minor degradation. gamma = 0 did not.</text>
</svg>

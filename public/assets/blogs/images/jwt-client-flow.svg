<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="flowTitle flowDesc">
  <title id="flowTitle">Browser request and silent refresh</title>
  <desc id="flowDesc">The interceptor attaches the in-memory access token. On a 401 it takes a Web Lock, refreshes once with the cookie, and retries the original call. A second failure logs the user out.</desc>
  <rect width="960" height="680" fill="#f7f3ea"/>
  <text x="36" y="42" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="18">Figure 6</text>
  <text x="36" y="74" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">One refresh, even from five calls</text>
  <text x="36" y="102" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="15">The lock is per origin, so other tabs wait instead of presenting a token that was just rotated.</text>

  <rect x="36" y="140" width="200" height="70" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="136" y="170" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">GET /orders</text>
  <text x="136" y="192" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13">five in parallel</text>

  <line x1="236" y1="175" x2="286" y2="175" stroke="#44403c" stroke-width="1.7" marker-end="url(#a6)"/>

  <rect x="296" y="140" width="220" height="70" rx="12" fill="#ffffff" stroke="#44403c" stroke-width="2"/>
  <text x="406" y="170" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Interceptor</text>
  <text x="406" y="192" text-anchor="middle" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">add Bearer if we have one</text>

  <line x1="516" y1="175" x2="566" y2="175" stroke="#44403c" stroke-width="1.7" marker-end="url(#a6)"/>

  <rect x="576" y="140" width="200" height="70" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="676" y="170" text-anchor="middle" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">401</text>
  <text x="676" y="192" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13">access token expired</text>

  <line x1="676" y1="210" x2="676" y2="252" stroke="#44403c" stroke-width="1.7" marker-end="url(#a6)"/>

  <rect x="486" y="260" width="380" height="88" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="676" y="294" text-anchor="middle" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">navigator.locks "auth-refresh"</text>
  <text x="676" y="320" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">this tab and the other tabs queue</text>

  <line x1="486" y1="304" x2="430" y2="304" stroke="#44403c" stroke-width="1.7" marker-end="url(#a6)"/>

  <rect x="150" y="260" width="270" height="88" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="285" y="294" text-anchor="middle" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">POST /api/auth/refresh</text>
  <text x="285" y="318" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">cookie rides along</text>

  <line x1="285" y1="348" x2="285" y2="392" stroke="#44403c" stroke-width="1.7" marker-end="url(#a6)"/>

  <rect x="120" y="400" width="330" height="88" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="285" y="434" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">New access token in memory</text>
  <text x="285" y="458" text-anchor="middle" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="14">Set-Cookie replaces the refresh</text>

  <line x1="450" y1="444" x2="520" y2="444" stroke="#44403c" stroke-width="1.7" marker-end="url(#a6)"/>

  <rect x="530" y="400" width="380" height="88" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="720" y="434" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Retry the original call once</text>
  <text x="720" y="458" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">second 401: logout, clear cookie</text>

  <rect x="36" y="524" width="888" height="120" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
  <text x="60" y="562" fill="#9a3412" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Skip this path for /api/auth/*.</text>
  <text x="60" y="594" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">A 401 from login or refresh must not start another refresh. That loop burns the family.</text>
  <text x="60" y="622" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">A reload has no memory token. The same lock runs once before the first guarded route renders.</text>

  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#44403c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>

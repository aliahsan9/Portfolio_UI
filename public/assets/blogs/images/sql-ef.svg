<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="efTitle efDesc">
  <title id="efTitle">Three ways EF Core turns a LINQ query into page reads</title>
  <desc id="efDesc">Calling ToList before Where runs the filter in the CLR after the whole table has crossed the network. A loop that queries customers per order is one round trip plus one per order. A single IQueryable with a Select projection is one SQL statement, and the storage engine only reads the pages that statement touches.</desc>
  <rect width="960" height="660" fill="#f7f3ea"/>
  <text x="36" y="40" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="18">Figure 6</text>
  <text x="36" y="72" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">The round trips are visible in the LINQ, once you know where SQL stops</text>
  <text x="36" y="100" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="15">IQueryable is an expression tree. IEnumerable is already rows in the process.</text>

  <rect x="28" y="128" width="292" height="400" rx="14" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="174" y="160" text-anchor="middle" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">ToList, then Where</text>
  <rect x="48" y="180" width="252" height="64" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="174" y="206" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">SELECT of every row</text>
  <text x="174" y="226" text-anchor="middle" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="12">50,000 pages leave the server</text>
  <line x1="174" y1="244" x2="174" y2="272" stroke="#b91c1c" stroke-width="1.6" marker-end="url(#efArrow)"/>
  <rect x="48" y="276" width="252" height="64" rx="8" fill="#ffffff" stroke="#44403c" stroke-width="1.5"/>
  <text x="174" y="302" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">filter in the CLR</text>
  <text x="174" y="322" text-anchor="middle" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="12">the database never saw it</text>
  <text x="48" y="376" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="13">The expression tree ended</text>
  <text x="48" y="398" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="13">at ToList. Anything after</text>
  <text x="48" y="420" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="13">that is LINQ to Objects.</text>
  <text x="48" y="460" fill="#78716c" font-family="Segoe UI, sans-serif" font-size="13">Same trap: a method that</text>
  <text x="48" y="480" fill="#78716c" font-family="Segoe UI, sans-serif" font-size="13">returns IEnumerable.</text>

  <rect x="334" y="128" width="292" height="400" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
  <text x="480" y="160" text-anchor="middle" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">One query per order</text>
  <rect x="354" y="180" width="252" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="480" y="212" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">1 query: the orders</text>
  <line x1="480" y1="232" x2="480" y2="256" stroke="#b45309" stroke-width="1.6" marker-end="url(#efArrowA)"/>
  <rect x="354" y="260" width="252" height="52" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="480" y="292" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">N queries: each customer</text>
  <text x="354" y="348" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="13">1,000 orders is 1,001 round</text>
  <text x="354" y="370" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="13">trips. Each trip is latency</text>
  <text x="354" y="392" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="13">plus its own plan execution.</text>
  <text x="354" y="432" fill="#78716c" font-family="Segoe UI, sans-serif" font-size="13">EF Core does not do this by</text>
  <text x="354" y="454" fill="#78716c" font-family="Segoe UI, sans-serif" font-size="13">itself. A loop you wrote does.</text>
  <text x="354" y="490" fill="#78716c" font-family="Segoe UI, sans-serif" font-size="13">Lazy-loading proxies are opt-in.</text>

  <rect x="640" y="128" width="292" height="400" rx="14" fill="#ffffff" stroke="#15803d" stroke-width="1.8"/>
  <text x="786" y="160" text-anchor="middle" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">One expression tree</text>
  <rect x="660" y="180" width="252" height="88" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="786" y="206" text-anchor="middle" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">Where, OrderBy, Select, Take</text>
  <text x="786" y="228" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="12">still IQueryable</text>
  <text x="786" y="248" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="12">one SQL batch at ToListAsync</text>
  <line x1="786" y1="268" x2="786" y2="300" stroke="#15803d" stroke-width="1.6" marker-end="url(#efArrowG)"/>
  <rect x="660" y="304" width="252" height="64" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
  <text x="786" y="330" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">pages for that plan only</text>
  <text x="786" y="350" text-anchor="middle" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="12">seek, then a few leaf pages</text>
  <text x="660" y="400" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="13">A Select of four columns is</text>
  <text x="660" y="422" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="13">not tracked. There is no entity</text>
  <text x="660" y="444" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="13">to snapshot. Customer.Name</text>
  <text x="660" y="466" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="13">becomes a join, not a loop.</text>
  <text x="660" y="500" fill="#78716c" font-family="Segoe UI, sans-serif" font-size="13">Read it with ToQueryString.</text>

  <rect x="28" y="544" width="904" height="92" rx="14" fill="#ffffff" stroke="#44403c" stroke-width="1.6"/>
  <text x="48" y="574" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Include of a collection is a third shape</text>
  <text x="48" y="598" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="14">One JOIN repeats the parent columns once per child. AsSplitQuery sends one statement per collection.</text>
  <text x="48" y="620" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="14">Those statements are not one snapshot, unless you wrap them in a transaction.</text>
  <defs>
    <marker id="efArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#b91c1c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="efArrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#b45309" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="efArrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#15803d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>

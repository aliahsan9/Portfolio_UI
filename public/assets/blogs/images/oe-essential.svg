<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="oeEssTitle oeEssDesc">
  <title id="oeEssTitle">Essential complexity of a school versus accidental machinery</title>
  <desc id="oeEssDesc">The left column lists facts about a school that remain true even on paper. The right column lists abstractions added before a second implementation existed.</desc>
  <rect width="960" height="660" fill="#f7f3ea"/>
  <text x="36" y="42" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="18">Figure 1</text>
  <text x="36" y="76" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">Two piles, one school</text>
  <text x="36" y="106" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="15">Brooks, 1987. The left pile is the problem. The right pile is a representation of it.</text>

  <rect x="28" y="132" width="442" height="400" rx="16" fill="#ffffff" stroke="#15803d" stroke-width="2.2"/>
  <text x="48" y="166" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">ESSENTIAL &#183; THE SCHOOL</text>
  <text x="48" y="190" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="14">True if the database is a paper register.</text>

  <circle cx="64" cy="230" r="5" fill="#15803d"/>
  <text x="84" y="235" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">A student is enrolled in one school</text>
  <circle cx="64" cy="272" r="5" fill="#15803d"/>
  <text x="84" y="277" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">One attendance mark per student per day</text>
  <circle cx="64" cy="314" r="5" fill="#15803d"/>
  <text x="84" y="319" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">A term is a calendar the board published</text>
  <circle cx="64" cy="356" r="5" fill="#15803d"/>
  <text x="84" y="361" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">A teacher sees that school's rows only</text>
  <circle cx="64" cy="398" r="5" fill="#15803d"/>
  <text x="84" y="403" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">A fee follows a written schedule</text>
  <circle cx="64" cy="440" r="5" fill="#15803d"/>
  <text x="84" y="445" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">A report card exists because a ministry asks</text>
  <text x="48" y="498" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="14">Delete the software. These remain.</text>

  <rect x="490" y="132" width="442" height="400" rx="16" fill="#ffffff" stroke="#b91c1c" stroke-width="2.2"/>
  <text x="510" y="166" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">ACCIDENTAL &#183; THE MACHINERY</text>
  <text x="510" y="190" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="14">Added before a second caller existed.</text>

  <circle cx="526" cy="230" r="5" fill="#b91c1c"/>
  <text x="546" y="235" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">IStudentRepository, one class behind it</text>
  <circle cx="526" cy="272" r="5" fill="#b91c1c"/>
  <text x="546" y="277" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">A specification object for one Where</text>
  <circle cx="526" cy="314" r="5" fill="#b91c1c"/>
  <text x="546" y="319" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">Unit of work around one DbContext</text>
  <circle cx="526" cy="356" r="5" fill="#b91c1c"/>
  <text x="546" y="361" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">A command and a handler for each GET</text>
  <circle cx="526" cy="398" r="5" fill="#b91c1c"/>
  <text x="546" y="403" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">A mapping profile for four fields</text>
  <circle cx="526" cy="440" r="5" fill="#b91c1c"/>
  <text x="546" y="445" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">A project split, for services later</text>
  <text x="510" y="498" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="14">Delete these. The school still enrolls.</text>

  <rect x="28" y="552" width="904" height="80" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
  <text x="48" y="584" fill="#9a3412" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">I grew the right column and called it architecture.</text>
  <text x="48" y="610" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">Accidental complexity can be removed. Essential complexity is the product.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="oeParnasTitle oeParnasDesc">
  <title id="oeParnasTitle">One change under two decompositions</title>
  <desc id="oeParnasDesc">Adding a reason string to a late mark touches every processing step in a layered cut, and only the attendance module when modules hide decisions.</desc>
  <rect width="960" height="640" fill="#f7f3ea"/>
  <text x="36" y="42" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="18">Figure 3</text>
  <text x="36" y="76" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">The same change, two cuts</text>
  <text x="36" y="106" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="15">Change: a Late mark stores a reason. Parnas, CACM, December 1972.</text>

  <text x="36" y="148" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">CUT BY PROCESSING STEP &#183; THE FLOWCHART</text>

  <rect x="28" y="164" width="96" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.7"/>
  <text x="76" y="201" fill="#7f1d1d" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">Endpoint</text>
  <rect x="132" y="164" width="96" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.7"/>
  <text x="180" y="201" fill="#7f1d1d" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">Command</text>
  <rect x="236" y="164" width="96" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.7"/>
  <text x="284" y="201" fill="#7f1d1d" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">Validator</text>
  <rect x="340" y="164" width="96" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.7"/>
  <text x="388" y="201" fill="#7f1d1d" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">Handler</text>
  <rect x="444" y="164" width="96" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.7"/>
  <text x="492" y="201" fill="#7f1d1d" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">IRepo</text>
  <rect x="548" y="164" width="96" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.7"/>
  <text x="596" y="201" fill="#7f1d1d" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">Repo</text>
  <rect x="652" y="164" width="88" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.7"/>
  <text x="696" y="201" fill="#7f1d1d" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">Spec</text>
  <rect x="748" y="164" width="80" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.7"/>
  <text x="788" y="201" fill="#7f1d1d" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">DTO</text>
  <rect x="836" y="164" width="96" height="64" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.7"/>
  <text x="884" y="201" fill="#7f1d1d" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">Map</text>

  <text x="36" y="258" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="14">Every step learns the new field. The lateness rule has no home. It is smeared across the steps.</text>

  <text x="36" y="312" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">CUT BY THE DECISION THAT CAN CHANGE &#183; INFORMATION HIDING</text>

  <rect x="28" y="332" width="210" height="130" rx="12" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.6"/>
  <text x="48" y="366" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">TENANCY</text>
  <text x="48" y="396" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">Unchanged.</text>
  <text x="48" y="422" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">Still one school id.</text>

  <rect x="258" y="332" width="230" height="130" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2.4"/>
  <text x="278" y="366" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">ATTENDANCE</text>
  <text x="278" y="396" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">Reason lives here.</text>
  <text x="278" y="422" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">The late rule lives here.</text>

  <rect x="508" y="332" width="210" height="130" rx="12" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.6"/>
  <text x="528" y="366" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">FEES</text>
  <text x="528" y="396" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">Does not know</text>
  <text x="528" y="422" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">what Late means.</text>

  <rect x="738" y="332" width="194" height="130" rx="12" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.6"/>
  <text x="758" y="366" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">STUDENTS</text>
  <text x="758" y="396" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">Still a person</text>
  <text x="758" y="422" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">in one school.</text>

  <rect x="28" y="492" width="904" height="116" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
  <text x="48" y="526" fill="#9a3412" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Begin with the decisions that are likely to change. Hide each one.</text>
  <text x="48" y="556" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">Parnas walked five likely changes through both cuts of a KWIC index. In the flowchart</text>
  <text x="48" y="580" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">cut, two of them touched every module. A module is a decision, not a step.</text>
</svg>

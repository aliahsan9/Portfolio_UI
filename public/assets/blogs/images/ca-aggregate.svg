<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="aggTitle aggDesc">
  <title id="aggTitle">Order aggregate boundary</title>
  <desc id="aggDesc">The order aggregate contains the order, its lines, and the snapshotted total. Each line stores sku, quantity, and unit price in minor units. The product catalog sits outside. A later catalog price is not joined back onto the order. After submit, adding a line is refused.</desc>
  <rect width="720" height="640" fill="#f7f3ea"/>
  <text x="24" y="36" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="16">Figure 2</text>
  <text x="24" y="66" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">The order owns the price it was given</text>
  <text x="24" y="92" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="14">One consistency boundary. The catalog is a different aggregate, referenced by SKU only.</text>

  <rect x="20" y="114" width="430" height="400" rx="14" fill="#ffffff" stroke="#15803d" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="40" y="146" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">ORDER AGGREGATE</text>
  <text x="40" y="170" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">loaded and saved together</text>

  <rect x="40" y="188" width="390" height="70" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.7"/>
  <text x="56" y="216" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Order</text>
  <text x="56" y="240" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13">Draft -> Submitted -> total written only by Submit</text>

  <rect x="40" y="272" width="390" height="56" rx="10" fill="#f7f3ea" stroke="#44403c" stroke-width="1.4"/>
  <text x="56" y="296" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">SKU-1 -> qty 2 -> 1999 minor -> USD</text>
  <text x="56" y="316" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">$19.99 copied onto the line at AddLine</text>

  <rect x="40" y="340" width="390" height="56" rx="10" fill="#f7f3ea" stroke="#44403c" stroke-width="1.4"/>
  <text x="56" y="364" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Line total 3998 -> stored on the order at Submit</text>
  <text x="56" y="384" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">$39.98. A later catalog edit cannot see this column.</text>

  <rect x="40" y="412" width="390" height="78" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="56" y="440" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">After Submitted</text>
  <text x="56" y="464" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13">AddLine -> order.closed -> Submit -> order.not_draft</text>

  <rect x="470" y="188" width="230" height="150" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="488" y="218" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">CATALOG</text>
  <text x="488" y="246" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">SKU-1 today</text>
  <text x="488" y="270" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">2499 minor</text>
  <text x="488" y="296" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">$24.99, edited Tuesday</text>
  <text x="488" y="318" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="13">outside the boundary</text>

  <line x1="470" y1="300" x2="430" y2="300" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="478" y="372" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">No Product FK</text>
  <text x="478" y="396" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="13">A join to the live price</text>
  <text x="478" y="416" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="13">would reprint history.</text>

  <rect x="20" y="532" width="680" height="84" rx="12" fill="#ffffff" stroke="#44403c" stroke-width="1.6"/>
  <text x="40" y="564" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">AddLine copies 1999 into the line. Submit writes 3998 onto the order.</text>
  <text x="40" y="590" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="14">The catalog's 2499 is a different aggregate and a different transaction.</text>
</svg>

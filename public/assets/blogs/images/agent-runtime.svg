<svg xmlns="http://www.w3.org/2000/svg" width="960" height="820" viewBox="0 0 960 820" role="img" aria-labelledby="rtTitle rtDesc">
  <title id="rtTitle">One step inside the agent runtime</title>
  <desc id="rtDesc">The model returns text. The runtime parses it, checks the tool name and arguments, and then branches. A side-effect tool returns to the human and does not run. A read-only tool runs with a timeout, is truncated, and is appended as data.</desc>
  <rect width="960" height="820" fill="#f7f3ea"/>
  <text x="36" y="42" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="18">Figure 4</text>
  <text x="36" y="74" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">The model emits text. The runtime decides.</text>
  <text x="36" y="104" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="15">Every arrow below is code. None of them are a sentence in the system prompt.</text>

  <rect x="36" y="132" width="200" height="68" rx="12" fill="#ffffff" stroke="#44403c" stroke-width="2"/>
  <text x="136" y="160" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Model string</text>
  <text x="136" y="182" text-anchor="middle" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="12">untrusted bytes</text>

  <line x1="236" y1="166" x2="268" y2="166" stroke="#44403c" stroke-width="1.7" marker-end="url(#art)"/>

  <rect x="276" y="132" width="210" height="68" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="381" y="160" text-anchor="middle" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">One JSON object</text>
  <text x="381" y="182" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="12">else: error, and count a step</text>

  <line x1="486" y1="166" x2="518" y2="166" stroke="#44403c" stroke-width="1.7" marker-end="url(#art)"/>

  <rect x="526" y="132" width="200" height="68" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="626" y="160" text-anchor="middle" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Name on allowlist</text>
  <text x="626" y="182" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="12">unknown name: error</text>

  <line x1="726" y1="166" x2="756" y2="166" stroke="#44403c" stroke-width="1.7" marker-end="url(#art)"/>

  <rect x="764" y="132" width="164" height="68" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="846" y="160" text-anchor="middle" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Schema</text>
  <text x="846" y="182" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="12">types and ranges</text>

  <line x1="790" y1="200" x2="360" y2="258" stroke="#15803d" stroke-width="1.7" marker-end="url(#artg)"/>
  <line x1="890" y1="200" x2="760" y2="258" stroke="#b91c1c" stroke-width="1.7" marker-end="url(#artr)"/>

  <rect x="36" y="258" width="430" height="110" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="56" y="290" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Read-only tool</text>
  <text x="56" y="318" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">Invoke with a timeout. Parameters, never concatenated SQL.</text>
  <text x="56" y="344" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">Truncate to 2,000 characters. Empty output becomes a sentence.</text>

  <rect x="520" y="258" width="408" height="110" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="540" y="290" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Side-effect tool</text>
  <text x="540" y="318" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">Do not invoke. Return the exact arguments to the caller.</text>
  <text x="540" y="344" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">The model does not get another turn inside this loop.</text>

  <line x1="251" y1="368" x2="251" y2="408" stroke="#44403c" stroke-width="1.7" marker-end="url(#art)"/>

  <rect x="36" y="414" width="430" height="88" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="56" y="448" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Append, then loop</text>
  <text x="56" y="474" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">The bytes are an observation. They are not an instruction.</text>

  <rect x="520" y="414" width="408" height="88" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="540" y="448" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Stop: NeedsApproval</text>
  <text x="540" y="474" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">A person sees the arguments. A button is the actuator.</text>

  <rect x="28" y="528" width="904" height="260" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
  <text x="52" y="566" fill="#9a3412" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Stop conditions, in the order the loop checks them</text>
  <text x="52" y="602" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">1. kind = finish, and the answer is non-empty. The caller still runs the set check on the draft.</text>
  <text x="52" y="632" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">2. The named tool has SideEffect set. Pending arguments leave the process. There is no second turn.</text>
  <text x="52" y="662" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">3. The step counter hits 8, or the model call itself throws. BudgetExhausted, or ModelFailed.</text>
  <text x="52" y="692" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">4. Bad JSON, an unknown name, a schema miss, a timeout, or an empty result is not a stop.</text>
  <text x="52" y="722" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">It is the next observation, and the step still counts. Prose instead of JSON burns the budget.</text>
  <text x="52" y="756" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">A delimiter around the observation is a hint to the model. The allowlist is the constraint.</text>

  <defs>
    <marker id="art" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#44403c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="artg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#15803d" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="artr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#b91c1c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>

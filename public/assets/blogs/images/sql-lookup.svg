<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="lookupTitle lookupDesc">
  <title id="lookupTitle">Key lookup versus a covering leaf</title>
  <desc id="lookupDesc">A nonclustered leaf stores the index key and the row locator, which is the clustered key. Fetching any other column is a key lookup: another descent of the clustered B+ tree per row. INCLUDE columns are stored only on the nonclustered leaf, so a covering query stops there and the upper levels of the tree stay narrow.</desc>
  <rect width="960" height="680" fill="#f7f3ea"/>
  <text x="36" y="40" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="18">Figure 3</text>
  <text x="36" y="72" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">The leaf that answers the query, and the one that does not</text>
  <text x="36" y="100" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="15">Clustered key is OrderId. The nonclustered leaf already carries it, as the locator. It does not carry Total.</text>

  <rect x="28" y="124" width="444" height="400" rx="14" fill="#ffffff" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="48" y="156" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Index on (CustomerId)</text>
  <text x="48" y="180" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">SELECT OrderId, Total</text>

  <rect x="48" y="200" width="400" height="70" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="248" y="228" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">nonclustered seek</text>
  <text x="248" y="250" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13">leaf row: CustomerId, OrderId</text>

  <line x1="248" y1="270" x2="248" y2="304" stroke="#b91c1c" stroke-width="1.7" marker-end="url(#lookArrow)"/>

  <rect x="48" y="308" width="400" height="78" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="248" y="338" text-anchor="middle" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">key lookup, once per row</text>
  <text x="248" y="360" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13">descend the clustered tree for Total</text>

  <text x="48" y="420" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="14">2,000 matches x a 3-level clustered</text>
  <text x="48" y="442" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="14">descent is thousands of random page</text>
  <text x="48" y="464" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="14">touches. The optimizer may scan instead.</text>
  <text x="48" y="498" fill="#78716c" font-family="Segoe UI, sans-serif" font-size="13">That crossover is a cost, not a fixed percent.</text>

  <rect x="488" y="124" width="444" height="400" rx="14" fill="#ffffff" stroke="#15803d" stroke-width="1.8"/>
  <text x="508" y="156" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Same key, INCLUDE (Total)</text>
  <text x="508" y="180" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">SELECT OrderId, Total</text>

  <rect x="508" y="200" width="400" height="86" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="708" y="232" text-anchor="middle" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">nonclustered leaf has the answer</text>
  <text x="708" y="256" text-anchor="middle" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13">CustomerId, OrderId, Total</text>

  <rect x="508" y="308" width="400" height="78" rx="10" fill="#f5f5f4" stroke="#a8a29e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="708" y="340" text-anchor="middle" fill="#78716c" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">clustered tree not read</text>
  <text x="708" y="362" text-anchor="middle" fill="#78716c" font-family="Segoe UI, sans-serif" font-size="13">no key lookup operator in the plan</text>

  <text x="508" y="420" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="14">INCLUDE columns sit on the leaf only.</text>
  <text x="508" y="442" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="14">They do not widen the root or the</text>
  <text x="508" y="464" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="14">intermediate pages, so fanout holds.</text>
  <text x="508" y="498" fill="#78716c" font-family="Segoe UI, sans-serif" font-size="13">Every insert still maintains this leaf.</text>

  <rect x="28" y="544" width="904" height="108" rx="14" fill="#ffffff" stroke="#44403c" stroke-width="1.6"/>
  <text x="48" y="576" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Where the bytes go</text>
  <text x="48" y="604" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="14">key columns  -&gt;  every level, and they define order</text>
  <text x="48" y="628" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="14">INCLUDE      -&gt;  leaf only. Clustered key is already in the leaf.</text>
  <defs>
    <marker id="lookArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#b91c1c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>

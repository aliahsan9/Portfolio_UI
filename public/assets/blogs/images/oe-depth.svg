<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="oeDepthTitle oeDepthDesc">
  <title id="oeDepthTitle">A shallow repository beside a deep tenant boundary</title>
  <desc id="oeDepthDesc">The repository interface repeats its implementation. The school context hides tenant scoping, the unique index, and insert assignment behind db.Students.</desc>
  <rect width="960" height="620" fill="#f7f3ea"/>
  <text x="36" y="42" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="18">Figure 5</text>
  <text x="36" y="76" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">Wide interface, thin body</text>
  <text x="36" y="106" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="15">Ousterhout, 2018. Depth is the work hidden behind a small surface.</text>

  <rect x="28" y="136" width="442" height="360" rx="16" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <text x="48" y="168" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">SHALLOW</text>
  <rect x="48" y="186" width="402" height="78" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="66" y="214" fill="#7f1d1d" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">SURFACE &#183; AS WIDE AS THE CLASS</text>
  <text x="66" y="238" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="13">Get  GetById  Add  Update  Delete</text>
  <text x="66" y="256" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="13">List  Query(Specification)</text>

  <text x="48" y="300" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">BODY &#183; THE SAME SEVEN CALLS</text>
  <text x="48" y="330" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">Each method forwards to one DbSet.</text>
  <text x="48" y="358" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">Callers learn every name.</text>
  <text x="48" y="386" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">School scoping is not in here.</text>
  <text x="48" y="414" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">A fake of this interface stays green</text>
  <text x="48" y="442" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">while the index bug sits in SQL.</text>
  <text x="48" y="476" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="14">Net cost. A concept, and no hidden decision.</text>

  <rect x="490" y="136" width="442" height="360" rx="16" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="510" y="168" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">DEEP</text>
  <rect x="510" y="186" width="180" height="64" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="528" y="212" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">SURFACE</text>
  <text x="528" y="234" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="15">db.Students</text>

  <text x="510" y="284" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">HIDDEN ONCE</text>
  <text x="510" y="314" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">SchoolId, sent as a SQL parameter</text>
  <text x="510" y="342" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">Filter on every LINQ query</text>
  <text x="510" y="370" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">Unique (SchoolId, Number)</text>
  <text x="510" y="398" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">Inserts take context.SchoolId</text>
  <text x="510" y="426" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">No school bound: context throws</text>
  <text x="510" y="454" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">Migrations use a local design tenant</text>
  <text x="510" y="488" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="14">Callers write business predicates only.</text>

  <rect x="28" y="516" width="904" height="76" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
  <text x="48" y="548" fill="#9a3412" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">The useful abstraction is the one a feature stops mentioning.</text>
  <text x="48" y="574" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">Tenancy left the attendance method. The repository interface had moved it into the signature.</text>
</svg>

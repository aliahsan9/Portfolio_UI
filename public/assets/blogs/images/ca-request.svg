<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="reqTitle reqDesc">
  <title id="reqTitle">Call order of Submit versus compile-time homes</title>
  <desc id="reqDesc">A submit request moves from the controller to the handler, into Order.Submit, then to the repository, the outbox, and one SaveChanges. Each step is colored by the project that owns it. The domain step is the only one that knows the business rule. The unit of work is the only one that sees the EF concurrency exception.</desc>
  <rect width="720" height="640" fill="#f7f3ea"/>
  <text x="24" y="36" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="16">Figure 3</text>
  <text x="24" y="66" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">The call walks outward. The references do not.</text>
  <text x="24" y="92" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="14">Color is the project that contains the type. Numbers are the order of the call.</text>

  <rect x="20" y="114" width="680" height="48" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="40" y="144" fill="#5b21b6" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">1  POST /orders/{id}/submit</text>
  <text x="430" y="144" fill="#5b21b6" font-family="Segoe UI, sans-serif" font-size="13">Api -> route constraint</text>

  <rect x="20" y="172" width="680" height="48" rx="10" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.8"/>
  <text x="40" y="202" fill="#5b21b6" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">2  OrdersController</text>
  <text x="430" y="202" fill="#5b21b6" font-family="Segoe UI, sans-serif" font-size="13">Api -> status codes</text>

  <rect x="20" y="230" width="680" height="48" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="40" y="260" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">3  SubmitOrderHandler</text>
  <text x="400" y="260" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="13">Application -> decides</text>

  <rect x="20" y="288" width="680" height="48" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="40" y="318" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">4  Order.Submit</text>
  <text x="360" y="318" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="13">Domain -> the rule lives here</text>

  <rect x="20" y="346" width="680" height="48" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="40" y="376" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">5  OrderRepository.GetAsync</text>
  <text x="400" y="376" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="13">Include lines, tracked</text>

  <rect x="20" y="404" width="680" height="48" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.8"/>
  <text x="40" y="434" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">6  EfOutbox.Enqueue</text>
  <text x="400" y="434" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="13">same DbContext, no SQL yet</text>

  <rect x="20" y="462" width="680" height="48" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="40" y="492" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">7  EfUnitOfWork.SaveChanges</text>
  <text x="390" y="492" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="13">one transaction, or Conflict</text>

  <rect x="20" y="530" width="680" height="86" rx="12" fill="#ffffff" stroke="#44403c" stroke-width="1.6"/>
  <text x="40" y="562" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">Step 4 names no framework. Step 7 is the only step that</text>
  <text x="40" y="586" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">catches the EF concurrency exception and returns Conflict.</text>
</svg>

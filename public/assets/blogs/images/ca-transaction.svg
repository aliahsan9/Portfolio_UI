<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="txTitle txDesc">
  <title id="txTitle">One SaveChanges for the order and the outbox</title>
  <desc id="txDesc">If the repository commits the order and a later call commits the outbox, a crash between them leaves a submitted order with no message. Putting both changes on one DbContext and calling SaveChanges once wraps them in one database transaction.</desc>
  <rect width="720" height="560" fill="#f7f3ea"/>
  <text x="24" y="36" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="16">Figure 4</text>
  <text x="24" y="66" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">The commit is the use case, not the repository</text>
  <text x="24" y="92" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="14">Relational SaveChanges is already one transaction. Splitting it in two is a new failure mode.</text>

  <rect x="20" y="116" width="332" height="300" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <rect x="20" y="116" width="332" height="42" rx="12" fill="#fee2e2"/>
  <rect x="20" y="146" width="332" height="12" fill="#fee2e2"/>
  <text x="36" y="144" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Two SaveChanges calls</text>
  <text x="36" y="186" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">1. Repository commits the order</text>
  <text x="36" y="214" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">2. Process dies</text>
  <text x="36" y="242" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">3. Outbox commit never runs</text>
  <text x="36" y="286" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Row says Submitted.</text>
  <text x="36" y="310" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">No message exists.</text>
  <text x="36" y="350" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">Fulfillment cannot hear about</text>
  <text x="36" y="370" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">an order the caller was told exists.</text>

  <rect x="368" y="116" width="332" height="300" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <rect x="368" y="116" width="332" height="42" rx="12" fill="#dcfce7"/>
  <rect x="368" y="146" width="332" height="12" fill="#dcfce7"/>
  <text x="384" y="144" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">One SaveChanges call</text>
  <text x="384" y="186" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">Change tracker holds both:</text>
  <text x="384" y="214" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="13">orders  updated</text>
  <text x="384" y="236" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="13">outbox  inserted</text>
  <text x="384" y="274" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">One SQL transaction.</text>
  <text x="384" y="302" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Both rows, or neither.</text>
  <text x="384" y="346" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">The repository does not commit.</text>
  <text x="384" y="366" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">The handler asks the unit of work.</text>

  <rect x="20" y="432" width="680" height="104" rx="12" fill="#ffffff" stroke="#44403c" stroke-width="1.6"/>
  <text x="40" y="464" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">Publish after commit. If the process dies before the publish mark, the</text>
  <text x="40" y="488" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">message can be sent twice. Consumers dedupe on the order id.</text>
  <text x="40" y="514" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="14">A publish before commit can announce an order the transaction rolled back.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640" role="img" aria-labelledby="depTitle depDesc">
  <title id="depTitle">Instability of the four projects</title>
  <desc id="depDesc">Domain has instability 0, Application 1/3, Infrastructure 2/3, and Api 1. Instability is outgoing project references divided by outgoing plus incoming. Domain references nothing. A reference from Domain to EF Core is the forbidden edge.</desc>
  <rect width="720" height="640" fill="#f7f3ea"/>
  <text x="24" y="36" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="16">Figure 1</text>
  <text x="24" y="66" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Who is allowed to change</text>
  <text x="24" y="92" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="14">I = Ce / (Ca + Ce), counted on project references. Ce leaves the project. Ca enters it.</text>

  <rect x="20" y="112" width="680" height="82" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="40" y="144" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Domain</text>
  <text x="40" y="170" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">Order, Money, the submit rule. References nothing.</text>
  <text x="520" y="146" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">I = 0</text>
  <text x="520" y="170" fill="#166534" font-family="Segoe UI, sans-serif" font-size="13">Ca 3 | Ce 0</text>

  <rect x="20" y="206" width="680" height="82" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="40" y="238" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Application</text>
  <text x="40" y="264" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">Handlers and ports. References Domain.</text>
  <text x="500" y="240" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">I = 1/3</text>
  <text x="500" y="264" fill="#1d4ed8" font-family="Segoe UI, sans-serif" font-size="13">Ca 2 | Ce 1</text>

  <rect x="20" y="300" width="680" height="82" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="40" y="332" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Infrastructure</text>
  <text x="40" y="358" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">EF Core, SQL Server. References Application and Domain.</text>
  <text x="500" y="334" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">I = 2/3</text>
  <text x="500" y="358" fill="#b45309" font-family="Segoe UI, sans-serif" font-size="13">Ca 1 | Ce 2</text>

  <rect x="20" y="394" width="680" height="82" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="40" y="426" fill="#5b21b6" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Api</text>
  <text x="40" y="452" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">HTTP and composition root. References the other three.</text>
  <text x="520" y="428" fill="#5b21b6" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">I = 1</text>
  <text x="520" y="452" fill="#6d28d9" font-family="Segoe UI, sans-serif" font-size="13">Ca 0 | Ce 3</text>

  <rect x="20" y="496" width="680" height="120" rx="12" fill="#ffffff" stroke="#44403c" stroke-width="1.6"/>
  <text x="40" y="526" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">The edge that must not appear</text>
  <text x="40" y="554" fill="#991b1b" font-family="Cascadia Code, Consolas, monospace" font-size="14">Domain -> Microsoft.EntityFrameworkCore</text>
  <text x="40" y="582" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="14">That reference makes Ce(Domain) = 1. The inner circle then changes when EF changes.</text>
  <defs>
    <marker id="caDep" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#44403c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>

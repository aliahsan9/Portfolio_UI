<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="histTitle histDesc">
  <title id="histTitle">Histogram steps and a sniffed parameter</title>
  <desc id="histDesc">SQL Server stores at most 200 histogram steps on the leading statistics column. Equality on a RANGE_HI_KEY uses EQ_ROWS. A value inside a step uses AVG_RANGE_ROWS, which is RANGE_ROWS divided by DISTINCT_RANGE_ROWS, the uniformity assumption. The first sniffed parameter value picks the estimate, and the cached plan is reused for later values.</desc>
  <rect width="960" height="680" fill="#f7f3ea"/>
  <text x="36" y="40" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="18">Figure 4</text>
  <text x="36" y="72" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">One histogram, two honest estimates, one cached plan</text>
  <text x="36" y="100" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="15">At most 200 steps. Inside a step the optimizer assumes the distinct values are spread evenly.</text>

  <line x1="70" y1="470" x2="560" y2="470" stroke="#44403c" stroke-width="1.6"/>
  <line x1="70" y1="470" x2="70" y2="160" stroke="#44403c" stroke-width="1.6"/>
  <text x="48" y="180" fill="#78716c" font-family="Segoe UI, sans-serif" font-size="12">EQ_ROWS</text>

  <rect x="100" y="400" width="70" height="70" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="190" y="430" width="70" height="40" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="280" y="180" width="70" height="290" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  <rect x="370" y="410" width="70" height="60" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <rect x="460" y="390" width="70" height="80" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>

  <text x="135" y="492" text-anchor="middle" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="12">100</text>
  <text x="225" y="492" text-anchor="middle" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="12">800</text>
  <text x="315" y="492" text-anchor="middle" fill="#991b1b" font-family="Cascadia Code, Consolas, monospace" font-size="12">4200</text>
  <text x="405" y="492" text-anchor="middle" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="12">9000</text>
  <text x="495" y="492" text-anchor="middle" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="12">15000</text>
  <text x="300" y="524" text-anchor="middle" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">RANGE_HI_KEY, the upper bound of each step</text>

  <text x="315" y="168" text-anchor="middle" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">EQ_ROWS = 40,000</text>

  <rect x="590" y="140" width="342" height="250" rx="12" fill="#ffffff" stroke="#44403c" stroke-width="1.6"/>
  <text x="610" y="172" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Which number gets used</text>
  <text x="610" y="206" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">CustomerId = 4200, a step edge</text>
  <text x="610" y="228" fill="#991b1b" font-family="Cascadia Code, Consolas, monospace" font-size="14">estimate = EQ_ROWS = 40000</text>
  <text x="610" y="264" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">CustomerId = 5000, inside the step</text>
  <text x="610" y="286" fill="#1e3a8a" font-family="Cascadia Code, Consolas, monospace" font-size="14">estimate = AVG_RANGE_ROWS</text>
  <text x="610" y="316" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">RANGE_ROWS / DISTINCT_RANGE_ROWS</text>
  <text x="610" y="344" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">Skew inside the step is invisible.</text>
  <text x="610" y="368" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">That is the uniformity assumption.</text>

  <rect x="28" y="548" width="904" height="104" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
  <text x="48" y="580" fill="#9a3412" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Parameter sniffing is the cache doing what it was built to do</text>
  <text x="48" y="608" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="14">The first execution with CustomerId = 4200 compiles a plan priced for 40,000 rows. The plan cache then</text>
  <text x="48" y="630" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="14">reuses that plan for CustomerId = 100, whose histogram step says 12 rows. The reverse mismatch hurts too.</text>
  <defs>
    <marker id="histArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#44403c" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
  </defs>
</svg>

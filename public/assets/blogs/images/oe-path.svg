<svg xmlns="http://www.w3.org/2000/svg" width="960" height="700" viewBox="0 0 960 700" role="img" aria-labelledby="oePathTitle oePathDesc">
  <title id="oePathTitle">One student list, two request paths</title>
  <desc id="oePathDesc">The same GET travels through eight types in the layered design, and through one query on a context that already filters by school in the rebuilt design.</desc>
  <rect width="960" height="700" fill="#f7f3ea"/>
  <text x="36" y="42" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="18">Figure 2</text>
  <text x="36" y="76" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">One GET, two shapes</text>
  <text x="36" y="106" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="15">GET /api/classes/{classId}/students. List the active students in a class.</text>

  <text x="36" y="148" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">FLOWCHART CUT &#183; 8 TYPES</text>
  <text x="520" y="148" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">MODULE CUT &#183; THE QUERY</text>

  <rect x="28" y="164" width="430" height="36" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="46" y="187" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="14">1   StudentsController</text>
  <rect x="28" y="208" width="430" height="36" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="46" y="231" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="14">2   MediatR.Send</text>
  <rect x="28" y="252" width="430" height="36" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="46" y="275" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="14">3   GetStudentsQuery</text>
  <rect x="28" y="296" width="430" height="36" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="46" y="319" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="14">4   GetStudentsValidator</text>
  <rect x="28" y="340" width="430" height="36" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="46" y="363" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="14">5   GetStudentsHandler</text>
  <rect x="28" y="384" width="430" height="36" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="46" y="407" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="14">6   IStudentRepository</text>
  <rect x="28" y="428" width="430" height="36" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="46" y="451" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="14">7   StudentByClassSpec</text>
  <rect x="28" y="472" width="430" height="36" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="46" y="495" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="14">8   Repository &#183; mapper &#183; DTO</text>

  <rect x="500" y="196" width="432" height="78" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="520" y="226" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">ENDPOINT</text>
  <text x="520" y="252" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">Authorization policy, then one method</text>

  <rect x="500" y="292" width="432" height="78" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="520" y="322" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">SCHOOL CONTEXT</text>
  <text x="520" y="348" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">Query filter already binds the school</text>

  <rect x="500" y="388" width="432" height="78" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="520" y="418" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">ONE PROJECTION</text>
  <text x="520" y="444" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">Where class, select StudentRow</text>

  <rect x="28" y="536" width="904" height="132" rx="14" fill="#ffffff" stroke="#44403c" stroke-width="1.6"/>
  <text x="48" y="570" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">The school filter is not a ninth box on the right.</text>
  <text x="48" y="600" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">It is a predicate on the model, parameterized by SchoolId, applied to every LINQ query.</text>
  <text x="48" y="630" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">The left path mentions tenancy in a resolver. The right path does not mention it in the feature.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-labelledby="pathTitle pathDesc">
  <title id="pathTitle">Command path and query path</title>
  <desc id="pathDesc">Submit loads the order and its lines, calls Order.Submit, and saves. The summary query selects id, status, total minor units, currency, and submitted time, and does not construct an Order. Returning IQueryable from the repository lets the inner circle write database queries.</desc>
  <rect width="720" height="600" fill="#f7f3ea"/>
  <text x="24" y="36" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="16">Figure 5</text>
  <text x="24" y="66" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">Two ways to read the same table</text>
  <text x="24" y="92" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="14">The command needs the rule. The screen needs five columns.</text>

  <rect x="20" y="114" width="332" height="280" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="36" y="146" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Command | Submit</text>
  <text x="36" y="180" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">Load Order and its lines</text>
  <text x="36" y="206" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">Change tracker is on</text>
  <text x="36" y="232" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">Call Order.Submit</text>
  <text x="36" y="258" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">Enqueue the outbox row</text>
  <text x="36" y="284" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">SaveChanges once</text>
  <text x="36" y="324" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">The entity runs the rule.</text>
  <text x="36" y="350" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">A forgotten Include makes Lines</text>
  <text x="36" y="370" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">empty, and Submit returns empty.</text>

  <rect x="368" y="114" width="332" height="280" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <text x="384" y="146" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Query | summary</text>
  <text x="384" y="178" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="13">id</text>
  <text x="384" y="200" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="13">status</text>
  <text x="384" y="222" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="13">total_minor, total_currency</text>
  <text x="384" y="244" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="13">submitted_at</text>
  <text x="384" y="278" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">No Order is constructed.</text>
  <text x="384" y="306" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">No join to order_lines.</text>
  <text x="384" y="330" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">The total was snapshotted.</text>
  <text x="384" y="354" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">The screen does not recompute it.</text>

  <rect x="20" y="412" width="680" height="164" rx="12" fill="#fff7ed" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="40" y="446" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">The shortcut that keeps the csproj looking clean</text>
  <text x="40" y="478" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="15">IQueryable&lt;Order&gt; Query();</text>
  <text x="40" y="510" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="14">The caller then writes Include, Where, and joins. That dialect is EF's.</text>
  <text x="40" y="536" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="14">IQueryable lives in System.Linq, so an assembly test will not see the leak.</text>
  <text x="40" y="560" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="14">A port returns an Order or a finished DTO. It does not return a composable query.</text>
</svg>

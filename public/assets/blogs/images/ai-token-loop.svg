<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="loopTitle loopDesc">
  <title id="loopTitle">Autoregressive next-token loop</title>
  <desc id="loopDesc">Context tokens produce a logit per vocabulary item. Dividing by temperature and applying softmax yields a distribution. One token is sampled and appended, and the forward pass runs again. Temperature cannot change which token has the largest logit.</desc>
  <rect width="960" height="560" fill="#f7f3ea"/>
  <text x="36" y="42" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="18">Figure 1</text>
  <text x="36" y="74" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">One forward pass, then the token joins the prompt</text>
  <text x="36" y="104" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="15">The training loss is the average of minus the log probability of the token that actually came next.</text>

  <rect x="28" y="132" width="168" height="118" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="44" y="164" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Context</text>
  <text x="44" y="190" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13">tokens already</text>
  <text x="44" y="210" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13">written</text>

  <rect x="230" y="132" width="168" height="118" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="246" y="164" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Logits z</text>
  <text x="246" y="190" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13">one real number</text>
  <text x="246" y="210" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13">per vocabulary token</text>

  <rect x="432" y="132" width="168" height="118" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="448" y="164" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Divide by T</text>
  <text x="448" y="190" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13">T = 1 leaves z alone</text>
  <text x="448" y="210" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13">T near 0 sharpens it</text>

  <rect x="634" y="132" width="298" height="118" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="650" y="164" fill="#5b21b6" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Softmax, then draw once</text>
  <text x="650" y="192" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="13">exp(z_i / T) / sum exp(z_j / T)</text>
  <text x="650" y="218" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">the draw is one token, not the whole list</text>

  <line x1="196" y1="191" x2="222" y2="191" stroke="#44403c" stroke-width="1.7" marker-end="url(#aLoop)"/>
  <line x1="398" y1="191" x2="424" y2="191" stroke="#44403c" stroke-width="1.7" marker-end="url(#aLoop)"/>
  <line x1="600" y1="191" x2="626" y2="191" stroke="#44403c" stroke-width="1.7" marker-end="url(#aLoop)"/>

  <rect x="28" y="278" width="904" height="72" rx="12" fill="#ffffff" stroke="#44403c" stroke-width="1.6"/>
  <text x="48" y="308" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">The sampled token is appended, and the same pass runs on the longer context.</text>
  <text x="48" y="332" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="14">A paragraph is a chain of these draws. Nothing in the loop searches for a novel idea.</text>

  <rect x="28" y="372" width="904" height="156" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="48" y="406" fill="#9a3412" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Temperature does not reorder tokens</text>
  <text x="48" y="438" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">If z_i is greater than z_j and T is positive, then z_i / T is greater than z_j / T.</text>
  <text x="48" y="466" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">The mode stays the mode at every temperature. T only decides how much probability the losers share.</text>
  <text x="48" y="500" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="14">A different winner requires different logits: a new fact in the context, a penalty, or a fine-tune.</text>
  <defs>
    <marker id="aLoop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#44403c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>

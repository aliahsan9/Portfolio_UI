<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="jwtWireTitle jwtWireDesc">
  <title id="jwtWireTitle">Compact JWT wire format</title>
  <desc id="jwtWireDesc">A signed JWT is three base64url segments separated by dots. Decoding the first two yields JSON. The third is a MAC over those bytes, not encryption.</desc>
  <rect width="960" height="680" fill="#f7f3ea"/>
  <text x="36" y="42" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="18">Figure 1</text>
  <text x="36" y="74" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">The token on the wire</text>
  <text x="36" y="102" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="15">Compact JWS serialization. Dots are separators, not decoration.</text>

  <rect x="28" y="128" width="270" height="132" rx="14" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2.2"/>
  <text x="46" y="158" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">SEGMENT 1 / HEADER</text>
  <text x="46" y="188" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="13">eyJhbGciOiJIUzI1NiIs</text>
  <text x="46" y="210" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="13">InR5cCI6ImF0K2p3dCJ9</text>
  <text x="46" y="238" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="13">base64url(UTF-8 JSON)</text>

  <text x="308" y="202" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700">.</text>

  <rect x="336" y="128" width="288" height="132" rx="14" fill="#fef3c7" stroke="#b45309" stroke-width="2.2"/>
  <text x="354" y="158" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">SEGMENT 2 / CLAIMS</text>
  <text x="354" y="188" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="13">eyJzdWIiOiI3YjMiLCJleHAi</text>
  <text x="354" y="210" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="13">OjE3MzE3MDAwMDB9</text>
  <text x="354" y="238" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="13">base64url(UTF-8 JSON)</text>

  <text x="634" y="202" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="32" font-weight="700">.</text>

  <rect x="662" y="128" width="270" height="132" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2.2"/>
  <text x="680" y="158" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">SEGMENT 3 / MAC</text>
  <text x="680" y="188" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="13">dBjftJeZ4CVP-mB92</text>
  <text x="680" y="210" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="13">K27uhbUJU1p1r_wW1g</text>
  <text x="680" y="238" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="13">base64url(32 raw bytes)</text>

  <line x1="163" y1="260" x2="163" y2="300" stroke="#44403c" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="480" y1="260" x2="480" y2="300" stroke="#44403c" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="797" y1="260" x2="797" y2="300" stroke="#44403c" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="392" y="286" fill="#78716c" font-family="Segoe UI, sans-serif" font-size="13">decode, do not decrypt</text>

  <rect x="28" y="308" width="270" height="210" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="46" y="340" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Header JSON</text>
  <text x="46" y="372" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="15">{</text>
  <text x="46" y="396" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="15">  "alg": "HS256",</text>
  <text x="46" y="420" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="15">  "typ": "at+jwt"</text>
  <text x="46" y="444" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="15">}</text>
  <text x="46" y="488" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">alg is a hint from the sender.</text>

  <rect x="322" y="308" width="316" height="210" rx="14" fill="#ffffff" stroke="#b45309" stroke-width="1.8"/>
  <text x="340" y="340" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">Claims, readable by anyone</text>
  <text x="340" y="372" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="15">"sub": "7b3f..."</text>
  <text x="340" y="396" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="15">"iss": "https://api.example"</text>
  <text x="340" y="420" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="15">"aud": "portfolio-spa"</text>
  <text x="340" y="444" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="15">"exp": 1731700000</text>
  <text x="340" y="468" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="15">"jti": "9f0c..."</text>
  <text x="340" y="496" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">No email. No roles you would hide.</text>

  <rect x="662" y="308" width="270" height="210" rx="14" fill="#ffffff" stroke="#15803d" stroke-width="1.8"/>
  <text x="680" y="340" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">What the MAC covers</text>
  <text x="680" y="376" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">ASCII bytes of</text>
  <text x="680" y="402" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">segment1 || "." || segment2</text>
  <text x="680" y="440" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">Keyed with the server secret.</text>
  <text x="680" y="466" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">Changing one claim bit</text>
  <text x="680" y="492" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15">breaks the MAC.</text>

  <rect x="28" y="544" width="904" height="100" rx="14" fill="#fff7ed" stroke="#c2410c" stroke-width="1.8"/>
  <text x="52" y="582" fill="#9a3412" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">base64url is an encoding (RFC 4648 section 5). It is not a cipher.</text>
  <text x="52" y="612" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">A copied Authorization header is readable. The MAC is integrity. TLS hides the bytes only in transit.</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#44403c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>

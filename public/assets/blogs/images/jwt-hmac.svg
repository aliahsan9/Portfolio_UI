<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="hmacTitle hmacDesc">
  <title id="hmacTitle">HS256 signing construction</title>
  <desc id="hmacDesc">UTF-8 JSON is base64url-encoded, joined with a dot, and passed through HMAC-SHA256 with a 256-bit key. The 32-byte MAC is base64url-encoded into the third segment.</desc>
  <rect width="960" height="640" fill="#f7f3ea"/>
  <text x="36" y="42" fill="#9a3412" font-family="Segoe Print, Comic Sans MS, Segoe UI, sans-serif" font-size="18">Figure 2</text>
  <text x="36" y="74" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700">What HS256 actually computes</text>
  <text x="36" y="102" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="15">RFC 7515 signing input, then HMAC as defined in RFC 2104 and required by RFC 7518 section 3.2.</text>

  <rect x="28" y="132" width="200" height="78" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="44" y="164" fill="#1e3a8a" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Header JSON</text>
  <text x="44" y="188" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13">UTF-8 bytes</text>

  <rect x="28" y="228" width="200" height="78" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="44" y="260" fill="#92400e" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Claims JSON</text>
  <text x="44" y="284" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="13">UTF-8 bytes</text>

  <line x1="228" y1="171" x2="286" y2="171" stroke="#44403c" stroke-width="1.7" marker-end="url(#a2)"/>
  <line x1="228" y1="267" x2="286" y2="267" stroke="#44403c" stroke-width="1.7" marker-end="url(#a2)"/>

  <rect x="296" y="132" width="168" height="78" rx="12" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="312" y="164" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">base64url</text>
  <text x="312" y="188" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">no padding "="</text>

  <rect x="296" y="228" width="168" height="78" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="2"/>
  <text x="312" y="260" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">base64url</text>
  <text x="312" y="284" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">URL-safe alphabet</text>

  <line x1="464" y1="171" x2="520" y2="210" stroke="#44403c" stroke-width="1.7" marker-end="url(#a2)"/>
  <line x1="464" y1="267" x2="520" y2="230" stroke="#44403c" stroke-width="1.7" marker-end="url(#a2)"/>

  <rect x="528" y="168" width="400" height="92" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="548" y="202" fill="#5b21b6" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Signing input, ASCII</text>
  <text x="548" y="230" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="14">b64(header) || "." || b64(claims)</text>

  <line x1="728" y1="260" x2="728" y2="304" stroke="#44403c" stroke-width="1.7" marker-end="url(#a2)"/>

  <rect x="528" y="312" width="190" height="92" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="546" y="348" fill="#991b1b" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Key K</text>
  <text x="546" y="374" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">e 256 random bits</text>
  <text x="546" y="394" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">never a password</text>

  <rect x="738" y="312" width="190" height="92" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="756" y="346" fill="#14532d" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">HMAC-SHA256</text>
  <text x="756" y="372" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="14">32-byte MAC</text>
  <text x="756" y="392" fill="#57534e" font-family="Segoe UI, sans-serif" font-size="13">then base64url</text>

  <line x1="718" y1="358" x2="738" y2="358" stroke="#44403c" stroke-width="1.7" marker-end="url(#a2)"/>

  <rect x="28" y="440" width="900" height="164" rx="14" fill="#ffffff" stroke="#44403c" stroke-width="1.6"/>
  <text x="52" y="474" fill="#1c1917" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">RFC 2104, with SHA-256's 64-byte block</text>
  <text x="52" y="508" fill="#1c1917" font-family="Cascadia Code, Consolas, monospace" font-size="15">HMAC(K, m) = H( (K0 XOR opad) || H( (K0 XOR ipad) || m ) )</text>
  <text x="52" y="538" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">ipad = 0x36 repeated 64 times. opad = 0x5c repeated 64 times. K0 is K zero-padded to 64 bytes.</text>
  <text x="52" y="566" fill="#44403c" font-family="Segoe UI, sans-serif" font-size="15">A key longer than the block is hashed first. The verifier recomputes the MAC and compares in constant time.</text>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5" fill="none" stroke="#44403c" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
